# Publikuje aplikację (app/static) na GitHub Pages jako samodzielną PWA,
# która przechowuje dane w przeglądarce (bez serwera).
name: Publikacja aplikacji (GitHub Pages)

on:
  push:
    branches: [ccr-fb1dc182-da1ttq]
    paths: ["app/static/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/static
      - id: deployment
        uses: actions/deploy-pages@v4
