# Buduje aplikację na Androida (APK) i publikuje ją w GitHub Releases pod stałym adresem:
# https://github.com/radek874-ctrl/moj-projekt/releases/download/android-latest/budzet-domowy.apk
name: Aplikacja Android (APK)

on:
  push:
    branches: [ccr-fb1dc182-da1ttq]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Budowa APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: Przygotowanie pliku
        run: cp android/app/build/outputs/apk/release/app-release.apk budzet-domowy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: budzet-domowy-apk
          path: budzet-domowy.apk

      - name: Publikacja w Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Aplikacja Budżet domowy na Androida (wersja 3.1.${{ github.run_number }}).

          Instalacja: pobierz budzet-domowy.apk na telefonie, otwórz plik i zezwól na instalację z tego źródła.
          Aplikacja aktualizuje się sama razem ze stroną; nowy plik APK jest potrzebny tylko przy zmianach w samej aplikacji Android."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release edit android-latest --notes "$NOTES"
          else
            gh release create android-latest --title "Budżet domowy – Android" --notes "$NOTES" --target "${{ github.sha }}"
          fi
          gh release upload android-latest budzet-domowy.apk --clobber
